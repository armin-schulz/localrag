spring:
    application:
        name: backend
    autoconfigure:
        exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# postgres
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: ${DB_DRIVER}

    # JPA/Hibernate Konfiguration
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
    port: ${BACKEND_PORT}

app:
    jwt:
        secret: ${JWT_SECRET}
        access-token-expiration: ${JWT_ACCESS_EXPIRATION}
        refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}
    admin:
        email: ${INIT_ADMIN_EMAIL}
        password: ${INIT_ADMIN_PASSWORD}
        displayName: ${INIT_ADMIN_DISPLAYNAME}

logging:
    level:
        de.localrag: DEBUG
        org.springframework.security: DEBUG