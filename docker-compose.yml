version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: localrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - localrag-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: localrag-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASSWORD}
    ports:
      - "${PG_ADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - localrag-network

volumes:
  postgres_data:
    driver: local

networks:
  localrag-network:
    driver: bridge